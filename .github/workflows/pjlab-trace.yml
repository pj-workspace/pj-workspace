name: Generate PJLAB contribution trace

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pjlab-trace.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark contribution traces
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pjlab-trace-light.svg?palette=github-light&color_snake=%239db45e&color_dots=%23ebedf0,%23d8e6b9,%23bcd484,%238fae51,%235f7f2f
            dist/pjlab-trace-dark.svg?palette=github-dark&color_snake=%23d5e7a5&color_dots=%23161b22,%23273622,%23426033,%23789948,%23d5e7a5

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
